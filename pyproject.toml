[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "interview-cortex"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.scripts]
run-inference = "jobs.run_inference:main"
run-delivery  = "jobs.run_delivery:main"

[tool.mypy]
python_version = "3.11"
strict = true
